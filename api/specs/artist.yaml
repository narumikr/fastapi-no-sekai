paths:
  /artists:
    post:
      tags:
        - artists
      summary: 新規アーティストの登録
      description: 新しいアーティストを登録する
      operationId: createArtist
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateArtistRequest'
      responses:
        '201':
          description: 作成成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArtistResponse'
        '400':
          $ref: './common.yaml#/components/responses/BadRequest'
        '409':
          $ref: './common.yaml#/components/responses/Conflict'
        '422':
          $ref: './common.yaml#/components/responses/UnprocessableEntity'
        '500':
          $ref: './common.yaml#/components/responses/InternalServerError'

components:
  schemas:
    CreateArtistRequest:
      type: object
      required:
        - artist_name
      properties:
        artist_name:
          type: string
          maxLength: 50
          description: アーティスト名
          example: Leo/need
        unit_name:
          type: string
          maxLength: 50
          nullable: true
          description: ユニット名
          example: Leo/need

    ArtistResponse:
      type: object
      required:
        - id
        - artist_name
        - unit_name
        - meta_info
      properties:
        id:
          type: integer
          description: アーティストID
        artist_name:
          type: string
          description: アーティスト名
        unit_name:
          type: string
          nullable: true
          description: ユニット名
        meta_info:
          $ref: './common.yaml#/components/schemas/MetaInfo'
